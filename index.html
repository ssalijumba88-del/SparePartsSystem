<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spare Parts System</title>

    <style>
        .in-stock {
            color: green;
            font-weight: bold;
        }

        .low-stock {
            color: orange;
            font-weight: bold;
        }

        .out-of-stock {
            color: red;
            font-weight: bold;
        }
    
    body {
    font-family: Arial, sans-serif;
    margin: 30px;
    background-color: #f4f6f8;
}

h2 {
    color: #333;
    text-align: center;
}

input {
    padding: 10px;
    margin: 5px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

button {
    padding: 10px 15px;
    margin: 3px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

table {
    width: 100%;
    margin-top: 25px;
    border-collapse: collapse;
    background-color: white;
}

th {
    background-color: #333;
    color: white;
    padding: 12px;
}

td {
    padding: 10px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}
.dashboard {
    display: flex;
    gap: 20px;
    margin: 20px 0;
}

.card {
    background-color: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    flex: 1;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.card h3 {
    margin: 0;
    color: #333;
}

.card p {
    font-size: 30px;
    font-weight: bold;
    margin: 10px 0 0;
}
</style>
</head>

    <h2>Add Spare Part</h2>

    <input type="text" id="partName" placeholder="Part Name">
    <input type="text" id="partNumber" placeholder="Part Number">

    <select id="partCategory">
    <option value="">Select Category</option>
    <option value="Engine">Engine</option>
    <option value="Brakes">Brakes</option>
    <option value="Electrical">Electrical</option>
    <option value="Suspension">Suspension</option>
    <option value="Oil & Filters">Oil & Filters</option>
    <option value="Other">Other</option>
</select>
    <input type="number" id="partPrice" placeholder="Price">
    <input type="number" id="partQuantity" placeholder="Quantity">
    <button id="addButton" onclick="addPart()">Add Part</button>
<input type="text" id="searchPart" placeholder="Search by part name or part number" onkeyup="searchParts()">
    <table border="1">
        <thead>
            <tr>
                <th>Part Name</th>
                <th>part Number</th>
                <th>Category</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Stock Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="partsList"></tbody>
    </table>

  <nav class="navbar">
    <span class="logo">Spare Parts</span>
    <span class="nav-title">Inventory System</span>
</nav>  

<h1>Spare Parts System</h1>
<p class="subtitle">Manage your spare parts, stock and inventory easily.</p>
<div class="dashboard">
    <div class="card">
        <h3>Total Parts</h3>
        <p id="totalParts">0</p>
    </div>

    <div class="card">
        <h3>Low Stock</h3>
        <p id="lowStock">0</p>
        <p id="lowStockWarning"></p>
    </div>

    <div class="card">
        <h3>Out of Stock</h3>
        <p id="outOfStock">0</p>
    </div>
</div>
<div class="card">
    <h3>Total Stock</h3>
    <p id="totalStock">0</p>
</div>
<div class="card">
    <h3>Total Value</h3>
    <p id="totalValue">0</p>
</div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="script.js?v=2"></script>
</body>
</html>
